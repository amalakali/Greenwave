<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>One Last Thing, Pa ❤️</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    overflow: hidden;
    font-family: Georgia, serif;
    background: linear-gradient(
        to bottom,
        #020111,
        #08052b,
        #151044,
        #05031c
    );
    color: white;
}

/* NIGHT SKY */
.sky {
    position: fixed;
    inset: 0;
    overflow: hidden;
}

/* STARS */
.star {
    position: absolute;
    width: 3px;
    height: 3px;
    background: white;
    border-radius: 50%;
    animation: twinkle 2s infinite alternate;
}

@keyframes twinkle {
    from {
        opacity: 0.2;
        transform: scale(0.7);
    }
    to {
        opacity: 1;
        transform: scale(1.4);
    }
}

/* MOON */
.moon {
    position: absolute;
    top: 70px;
    right: 12%;
    width: 100px;
    height: 100px;
    border-radius: 50%;
    background: #fff9d6;
    box-shadow:
        0 0 25px #fff9d6,
        0 0 60px rgba(255,255,220,0.5);
}

/* CLOUDS */
.cloud {
    position: absolute;
    width: 180px;
    height: 45px;
    background: rgba(255,255,255,0.08);
    border-radius: 50px;
    filter: blur(3px);
    animation: moveCloud 25s linear infinite;
}

.cloud::before,
.cloud::after {
    content: "";
    position: absolute;
    background: rgba(255,255,255,0.08);
    border-radius: 50%;
}

.cloud::before {
    width: 70px;
    height: 70px;
    left: 25px;
    bottom: 10px;
}

.cloud::after {
    width: 90px;
    height: 90px;
    right: 20px;
    bottom: 5px;
}

.cloud1 {
    top: 25%;
    left: -220px;
}

.cloud2 {
    top: 55%;
    left: -250px;
    animation-delay: 8s;
    animation-duration: 32s;
}

@keyframes moveCloud {
    from {
        transform: translateX(0);
    }
    to {
        transform: translateX(130vw);
    }
}

/* INTRO */
.intro {
    position: relative;
    z-index: 5;
    height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 20px;
}

.intro h1 {
    font-size: clamp(30px, 7vw, 55px);
    font-weight: normal;
    margin-bottom: 35px;
    text-shadow:
        0 0 10px rgba(255,255,255,0.8),
        0 0 30px rgba(255,150,220,0.7);
    animation: titleGlow 3s infinite alternate;
}

@keyframes titleGlow {
    from {
        text-shadow: 0 0 10px white;
    }
    to {
        text-shadow:
            0 0 15px white,
            0 0 40px #ff9edb;
    }
}

/* BUTTON */
button {
    border: 1px solid rgba(255,255,255,0.6);
    background: rgba(255,255,255,0.08);
    color: white;
    padding: 16px 30px;
    border-radius: 50px;
    font-size: 18px;
    font-family: Georgia, serif;
    cursor: pointer;

    box-shadow:
        0 0 10px rgba(255,255,255,0.5),
        0 0 30px rgba(255,120,200,0.5);

    animation: buttonGlow 2s infinite alternate;
}

@keyframes buttonGlow {
    from {
        transform: scale(1);
        box-shadow: 0 0 10px white;
    }
    to {
        transform: scale(1.05);
        box-shadow:
            0 0 20px white,
            0 0 45px #ff8bd8;
    }
}

button:hover {
    transform: scale(1.1);
}

/* CARD */
.card {
    position: absolute;
    z-index: 10;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) scale(0.5);
    width: min(90%, 420px);
    padding: 25px;
    text-align: center;

    background: rgba(10, 7, 40, 0.88);
    border: 1px solid rgba(255,255,255,0.25);
    border-radius: 25px;

    box-shadow:
        0 0 30px rgba(255,150,220,0.35),
        inset 0 0 30px rgba(255,255,255,0.03);

    opacity: 0;
    pointer-events: none;
}

.card.show {
    animation: cardOpen 1.5s ease forwards;
    pointer-events: auto;
}

@keyframes cardOpen {
    to {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1);
    }
}

/* PHOTO */
.card img {
    width: 100%;
    max-height: 380px;
    object-fit: cover;
    border-radius: 18px;
    display: block;
    margin-bottom: 25px;

    box-shadow:
        0 0 20px rgba(255,255,255,0.25),
        0 0 40px rgba(255,150,220,0.2);
}

/* MESSAGE */
.message {
    font-size: 20px;
    line-height: 1.7;
    margin-bottom: 15px;
}

.thankyou {
    font-size: 18px;
    line-height: 1.6;
    opacity: 0.95;
}

/* BURST STARS */
.burst-star {
    position: fixed;
    z-index: 20;
    left: 50%;
    top: 50%;
    font-size: 20px;
    pointer-events: none;

    animation: burst 1.2s ease-out forwards;
}

@keyframes burst {
    from {
        transform: translate(-50%, -50%) scale(0);
        opacity: 1;
    }

    to {
        transform:
            translate(
                calc(-50% + var(--x)),
                calc(-50% + var(--y))
            )
            scale(1.5);
        opacity: 0;
    }
}

/* FLOATING HEARTS */
.heart {
    position: fixed;
    z-index: 15;
    bottom: -30px;
    font-size: 25px;
    pointer-events: none;

    animation: floatHeart 4s ease-in forwards;
}

@keyframes floatHeart {
    from {
        transform: translateY(0) scale(0.7);
        opacity: 0;
    }

    20% {
        opacity: 1;
    }

    to {
        transform:
            translateY(-110vh)
            translateX(var(--move))
            scale(1.3);
        opacity: 0;
    }
}

/* SPARKLES */
.sparkle {
    position: fixed;
    z-index: 18;
    pointer-events: none;
    font-size: 18px;

    animation: sparkleAnim 1.5s ease-out forwards;
}

@keyframes sparkleAnim {
    from {
        transform: scale(0);
        opacity: 1;
    }

    to {
        transform: scale(2);
        opacity: 0;
    }
}

/* HIDE INTRO */
.intro.hide {
    animation: fadeOut 0.8s forwards;
}

@keyframes fadeOut {
    to {
        opacity: 0;
        visibility: hidden;
    }
}

@media (max-width: 500px) {

    .moon {
        width: 70px;
        height: 70px;
        top: 50px;
    }

    .card {
        padding: 18px;
    }

    .message {
        font-size: 18px;
    }

    .thankyou {
        font-size: 16px;
    }
}
</style>
</head>

<body>

<!-- NIGHT SKY -->
<div class="sky">

    <div class="moon"></div>

    <div class="cloud cloud1"></div>
    <div class="cloud cloud2"></div>

    <!-- STARS -->
    <div class="star" style="top:10%;left:15%;"></div>
    <div class="star" style="top:18%;left:30%;"></div>
    <div class="star" style="top:12%;left:55%;"></div>
    <div class="star" style="top:25%;left:75%;"></div>
    <div class="star" style="top:35%;left:10%;"></div>
    <div class="star" style="top:42%;left:25%;"></div>
    <div class="star" style="top:48%;left:60%;"></div>
    <div class="star" style="top:55%;left:85%;"></div>
    <div class="star" style="top:65%;left:20%;"></div>
    <div class="star" style="top:72%;left:45%;"></div>
    <div class="star" style="top:80%;left:70%;"></div>
    <div class="star" style="top:88%;left:90%;"></div>

</div>


<!-- INTRO SCREEN -->
<div class="intro" id="intro">

    <h1>One Last Thing, Pa… ❤️</h1>

    <button onclick="revealLove()">
        ✨ Tap Here, Appa ✨
    </button>

</div>


<!-- FINAL CARD -->
<div class="card" id="loveCard">


    <div class="message">
        No matter how old I grow,<br>
        I'll always be your little girl. ❤️
    </div>

    <div class="thankyou">
        Thank you for always being there, Appa. 🫂
    </div>

</div>


<script>

function revealLove() {

    /* Hide opening screen */
    document.getElementById("intro").classList.add("hide");

    /* STAR BURST */
    for (let i = 0; i < 55; i++) {

        const star = document.createElement("div");

        star.className = "burst-star";
        star.innerHTML = "✨";

        const angle = Math.random() * Math.PI * 2;
        const distance = 100 + Math.random() * 300;

        star.style.setProperty(
            "--x",
            Math.cos(angle) * distance + "px"
        );

        star.style.setProperty(
            "--y",
            Math.sin(angle) * distance + "px"
        );

        document.body.appendChild(star);

        setTimeout(() => {
            star.remove();
        }, 1300);
    }


    /* FLOATING HEARTS */
    for (let i = 0; i < 18; i++) {

        const heart = document.createElement("div");

        heart.className = "heart";
        heart.innerHTML = "❤️";

        heart.style.left =
            Math.random() * 100 + "vw";

        heart.style.setProperty(
            "--move",
            (Math.random() * 160 - 80) + "px"
        );

        heart.style.animationDelay =
            Math.random() * 1.5 + "s";

        document.body.appendChild(heart);

        setTimeout(() => {
            heart.remove();
        }, 5000);
    }


    /* SPARKLES */
    for (let i = 0; i < 25; i++) {

        const sparkle = document.createElement("div");

        sparkle.className = "sparkle";
        sparkle.innerHTML = "✦";

        sparkle.style.left =
            Math.random() * 100 + "vw";

        sparkle.style.top =
            Math.random() * 100 + "vh";

        sparkle.style.animationDelay =
            Math.random() * 1 + "s";

        document.body.appendChild(sparkle);

        setTimeout(() => {
            sparkle.remove();
        }, 2000);
    }


    /* SHOW CARD */
    setTimeout(() => {

        document
            .getElementById("loveCard")
            .classList.add("show");

    }, 1000);

}

</script>

</body>
</html>
